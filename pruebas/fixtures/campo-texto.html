<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba de CampoTexto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement, useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import CampoTexto from '/src/componentes/CampoTexto.jsx'

      function CampoTextoDePrueba() {
        const [valor, setValor] = useState('')

        return createElement(CampoTexto, {
          etiqueta: 'Descripción',
          nombre: 'descripcion',
          valor,
          alCambiar: (evento) => setValor(evento.target.value),
          ejemplo: 'Escribí una descripción',
          requerido: true,
        })
      }

      createRoot(document.getElementById('root')).render(createElement(CampoTextoDePrueba))
    </script>
  </body>
</html>
